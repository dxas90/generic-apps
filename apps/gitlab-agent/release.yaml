# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitlab-agent
spec:
  interval: 30m
  timeout: 5m
  releaseName: gitlab-agent
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: gitlab-agent-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: gitlab-agent
      version: v2.21.1
      sourceRef:
        kind: HelmRepository
        name: gitlab
