apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
spec:
  interval: 15m
  timeout: 10m
  releaseName: alloy
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: alloy-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: alloy
      version: 1.14.3
      sourceRef:
        kind: HelmRepository
        name: alloy
