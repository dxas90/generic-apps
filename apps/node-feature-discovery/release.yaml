apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: node-feature-discovery
spec:
  interval: 15m
  timeout: 10m
  releaseName: node-feature-discovery
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: node-feature-discovery-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: node-feature-discovery
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: node-feature-discovery
