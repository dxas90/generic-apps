replicaCount: 1

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9000

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: flipt.example.com
      paths:
        - path: /
          pathType: Prefix
  # tls:
  #   - secretName: flipt-tls
  #     hosts:
  #       - flipt.example.com

# ── Persistence ───────────────────────────────────────────────────────────────
# Needed for the default local storage backend.
# Disable when using a Git or S3/GCS/Azure backend.
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  # storageClass: ""

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── Autoscaling ───────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# ── Flipt v2 application config ───────────────────────────────────────────────
flipt:
  config:
    log:
      level: INFO
      encoding: console

    server:
      protocol: http
      host: 0.0.0.0
      http_port: 8080
      grpc_port: 9000

    # ── Storage backend ─────────────────────────────────────────────────────────
    # v2 is Git-native. Default is local FS (good for dev/single-node).
    # For production, point at a Git repo:
    # storage:
    #   type: git
    #   git:
    #     repository: https://github.com/org/flags.git
    #     ref: main
    #     polling_interval: 30s
    #     authentication:
    #       token:
    #         access_token: ""   # or use extraEnvVars / envFrom for secret injection
    storage:
      type: local
      local:
        path: /var/opt/flipt

    # ── Authentication ──────────────────────────────────────────────────────────
    # authentication:
    #   required: true
    #   session:
    #     domain: flipt.example.com
    #     secure: true
    #   methods:
    #     token:
    #       enabled: true
    #     oidc:
    #       enabled: true
    #       providers:
    #         my-provider:
    #           issuer_url: https://your-idp.com
    #           client_id: ""
    #           client_secret: ""
    #           redirect_address: https://flipt.example.com/auth/v1/method/oidc/my-provider/callback

    # ── Multi-environment (v2 feature) ─────────────────────────────────────────
    # environments:
    #   production:
    #     name: Production
    #     storage:
    #       type: git
    #       git:
    #         repository: https://github.com/org/flags.git
    #         ref: production

# ── Prometheus metrics ────────────────────────────────────────────────────────
metrics:
  serviceMonitor:
    enabled: false
