replicaCount: 1

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9000

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: flipt.example.com
      paths:
        - path: /
          pathType: Prefix
  # tls:
  #   - secretName: flipt-tls
  #     hosts:
  #       - flipt.example.com

# ── Persistence ───────────────────────────────────────────────────────────────
# Enable for the default SQLite backend so data survives pod restarts.
# Disable when using a remote database (PostgreSQL, MySQL, CockroachDB).
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  # storageClass: ""
  # existingClaim: ""

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── Autoscaling ───────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# ── Flipt application config ──────────────────────────────────────────────────
flipt:
  config:
    log:
      level: INFO
      encoding: console

    server:
      protocol: http
      host: 0.0.0.0
      http_port: 8080
      grpc_port: 9000

    # ── Database ────────────────────────────────────────────────────────────────
    # Default: SQLite at /var/opt/flipt/flipt.db (requires persistence.enabled=true)
    # For production switch to a managed database:
    # db:
    #   url: postgres://user:pass@postgres-host:5432/flipt?sslmode=require
    db:
      url: file:/var/opt/flipt/flipt.db
      max_idle_conn: 2
      max_open_conn: 0

    # ── Authentication ──────────────────────────────────────────────────────────
    # Uncomment to enable static token or OIDC auth.
    # authentication:
    #   required: false
    #   methods:
    #     token:
    #       enabled: true
    #       bootstrap:
    #         token: ""          # set via secret / env FLIPT_AUTHENTICATION_METHODS_TOKEN_BOOTSTRAP_TOKEN
    #     oidc:
    #       enabled: false

    # ── Storage backend (alternative to DB) ────────────────────────────────────
    # Use Git, S3, GCS, Azure, or OCI as a read-only flag source.
    # storage:
    #   type: git
    #   git:
    #     repository: https://github.com/org/flags.git
    #     ref: main
    #     directory: flipt
