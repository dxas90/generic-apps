replicaCount: 1

# ── Service ───────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  httpPort: 8080
  grpcPort: 9000

# ── Ingress ───────────────────────────────────────────────────────────────────
ingress:
  enabled: false
  className: ""
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: flipt.example.com
      paths:
        - path: /
          pathType: Prefix
  # tls:
  #   - secretName: flipt-tls
  #     hosts:
  #       - flipt.example.com

# ── Persistence ───────────────────────────────────────────────────────────────
# Needed for the default local storage backend.
# Disable when using a Git or S3/GCS/Azure backend.
persistence:
  enabled: true
  accessModes:
    - ReadWriteOnce
  size: 5Gi
  # storageClass: ""

# ── Resources ─────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# ── Autoscaling ───────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# ── Flipt v2 application config ───────────────────────────────────────────────
flipt:
  config:
    log:
      level: INFO
      encoding: console

    server:
      protocol: http
      host: 0.0.0.0
      http_port: 8080
      grpc_port: 9000

    # ── Storage backend ─────────────────────────────────────────────────────────
    # v2 storage is a named map of Git remote backends (not a type: local block).
    # By default no storage entry is set — Flipt uses its built-in local store,
    # backed by the persistence PVC below.
    #
    # To add a Git remote as a named storage backend:
    # storage:
    #   my-flags:
    #     remote: https://github.com/org/flags.git
    #     branch: main
    #     fetch_policy: strict       # strict | lenient
    #     backend:
    #       type: local              # memory | local (local persists to disk)
    #     # signature:               # GPG commit signing (Pro)
    #     #   key: ""

    # ── Authentication ──────────────────────────────────────────────────────────
    # authentication:
    #   required: true
    #   session:
    #     domain: flipt.example.com
    #     secure: true
    #   methods:
    #     token:
    #       enabled: true
    #     oidc:
    #       enabled: true
    #       providers:
    #         my-provider:
    #           issuer_url: https://your-idp.com
    #           client_id: ""
    #           client_secret: ""
    #           redirect_address: https://flipt.example.com/auth/v1/method/oidc/my-provider/callback

    # ── Multi-environment (v2 feature) ─────────────────────────────────────────
    # environments map named environments to storage backends.
    # environments:
    #   production:
    #     storage: my-flags          # references a key in the storage map above
    #     default: true

# ── Prometheus metrics ────────────────────────────────────────────────────────
metrics:
  serviceMonitor:
    enabled: false
