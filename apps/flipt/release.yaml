apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flipt
spec:
  interval: 15m
  timeout: 10m
  releaseName: flipt
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: flipt-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: flipt
      version: 0.88.0
      sourceRef:
        kind: HelmRepository
        name: flipt
