apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nats
spec:
  interval: 15m
  timeout: 10m
  releaseName: nats
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: nats-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: nats
      version: 2.15.1
      sourceRef:
        kind: HelmRepository
        name: nats
