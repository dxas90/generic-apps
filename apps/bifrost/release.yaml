apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bifrost
spec:
  interval: 15m
  timeout: 10m
  releaseName: bifrost
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: bifrost-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: bifrost
      version: 2.1.45
      sourceRef:
        kind: HelmRepository
        name: bifrost
