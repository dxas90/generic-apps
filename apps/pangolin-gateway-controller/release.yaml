# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pangolin-gateway-controller
spec:
  interval: 30m
  timeout: 5m
  releaseName: pangolin-gateway-controller
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: pangolin-gateway-controller-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: k8s/chart
      sourceRef:
        kind: GitRepository
        name: pangolin-gateway-controller
