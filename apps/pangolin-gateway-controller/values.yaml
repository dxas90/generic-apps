replicaCount: 2

image:
  repository: ghcr.io/dxas90/pangolin-gateway-controller
  pullPolicy: IfNotPresent
  tag: "0.11.1"

serviceAccount:
  create: true
  automount: false
  name: pangolin-gateway-controller
  projectedToken:
    enabled: true
    expirationSeconds: 3600

rbac:
  create: true
  gatewayApi: true
  newtManagement: true

gatewayClass:
  enable: false
  name: pangolin

pangolin:
  # Set via secret or consumer overlay — do not commit real values here
  apiKey: ""
  orgId: ""
  baseUrl: https://api.pangolin.net/v1
  newtImage: fosrl/newt:1.18.1

controller:
  gatewayClassName: pangolin
  watchNamespace: ""
  leaderElection: true
  leaderElectionId: pangolin-gateway-controller-leader

logging:
  level: info
  format: json

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: true
  ingress:
    - {}
  egress:
    - {}

serviceMonitor:
  enabled: false

webhook:
  enabled: false
