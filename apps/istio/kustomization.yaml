apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- namespace.yaml
- source.yaml
- release-base.yaml
- release-istiod.yaml
- release-cni.yaml
- release-ztunnel.yaml
configMapGenerator:
- name: istio-base-values
  namespace: istio-system
  files:
  - values.yaml=values-base.yaml
- name: istiod-values
  namespace: istio-system
  files:
  - values.yaml=values-istiod.yaml
- name: istio-cni-values
  namespace: istio-system
  files:
  - values.yaml=values-cni.yaml
- name: ztunnel-values
  namespace: istio-system
  files:
  - values.yaml=values-ztunnel.yaml
generatorOptions:
  disableNameSuffixHash: true
  labels:
    reconcile.fluxcd.io/watch: Enabled
