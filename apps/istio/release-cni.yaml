apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
spec:
  interval: 15m
  timeout: 10m
  releaseName: istio-cni
  maxHistory: 3
  dependsOn:
  - name: istio-base
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: istio-cni-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: cni
      version: 1.30.7
      sourceRef:
        kind: HelmRepository
        name: istio
