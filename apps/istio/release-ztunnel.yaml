apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: istio-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: ztunnel
  maxHistory: 3
  dependsOn:
  - name: istiod
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: ztunnel-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: ztunnel
      version: 1.30.6
      sourceRef:
        kind: HelmRepository
        name: istio
