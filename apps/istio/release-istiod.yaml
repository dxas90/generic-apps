apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
spec:
  interval: 15m
  timeout: 10m
  releaseName: istiod
  maxHistory: 3
  dependsOn:
  - name: istio-base
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: istiod-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: istiod
      version: 1.30.7
      sourceRef:
        kind: HelmRepository
        name: istio
