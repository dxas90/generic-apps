apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kong-gateway-operator
spec:
  interval: 15m
  timeout: 10m
  releaseName: kong-gateway-operator
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: kong-gateway-operator-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: gateway-operator
      version: 0.6.1
      sourceRef:
        kind: HelmRepository
        name: kong
