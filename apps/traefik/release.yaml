apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
spec:
  interval: 15m
  timeout: 10m
  releaseName: traefik
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: traefik-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: traefik
      version: 42.0.0
      sourceRef:
        kind: HelmRepository
        name: traefik
