fullnameOverride: blackbox-exporter
securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    add: [NET_RAW]
config:
  modules:
    http_2xx:
      prober: http
      timeout: 5s
      http:
        valid_http_versions: [HTTP/1.1, HTTP/2.0]
        follow_redirects: true
        preferred_ip_protocol: ipv4
    icmp:
      prober: icmp
      timeout: 5s
    tcp_connect:
      prober: tcp
      timeout: 5s
serviceMonitor:
  enabled: true
  defaults:
    interval: 1m
    scrapeTimeout: 10s
prometheusRule:
  enabled: true
  rules:
  - alert: BlackboxProbeFailed
    expr: probe_success == 0
    for: 15m
    labels:
      severity: critical
    annotations:
      summary: "Target {{ $labels.target }} is unreachable"
