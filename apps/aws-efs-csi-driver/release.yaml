apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-efs-csi-driver
spec:
  interval: 15m
  timeout: 10m
  releaseName: aws-efs-csi-driver
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: aws-efs-csi-driver-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: aws-efs-csi-driver
      version: 4.5.3
      sourceRef:
        kind: HelmRepository
        name: aws-efs-csi-driver
