apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: zitadel
spec:
  interval: 15m
  timeout: 10m
  releaseName: zitadel
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: zitadel-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: zitadel
      version: 10.5.0
      sourceRef:
        kind: HelmRepository
        name: zitadel
