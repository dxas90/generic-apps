apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vault
spec:
  interval: 15m
  timeout: 10m
  releaseName: vault
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: vault-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: vault
      version: 0.34.1
      sourceRef:
        kind: HelmRepository
        name: vault
