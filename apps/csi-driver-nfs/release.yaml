apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: csi-driver-nfs
  namespace: kube-system
spec:
  interval: 15m
  timeout: 10m
  releaseName: csi-driver-nfs
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: csi-driver-nfs-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: csi-driver-nfs
      version: 4.13.5
      sourceRef:
        kind: HelmRepository
        name: csi-driver-nfs
