persistence:
  enabled: true
  size: 1Gi
deployment:
  strategy: RollingUpdate
service:
  type: ClusterIP
  port: 80
  targetPort: 8080
ingress:
  enabled: false
serviceMonitor:
  enabled: false
config:
  metrics: true
  ui:
    title: Health Status
  connectivity:
    checker:
      target: 1.1.1.1:53
      interval: 1m
  endpoints:
  - name: example
    url: https://example.com
    interval: 1m
    conditions:
    - "[STATUS] == 200"
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 1000m
    memory: 512Mi
