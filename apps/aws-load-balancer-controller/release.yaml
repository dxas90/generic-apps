apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: aws-load-balancer-controller
spec:
  interval: 15m
  timeout: 10m
  releaseName: aws-load-balancer-controller
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: aws-load-balancer-controller-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: aws-load-balancer-controller
      version: 3.6.2
      sourceRef:
        kind: HelmRepository
        name: aws-load-balancer-controller
