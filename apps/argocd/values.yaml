global:
  domain: argocd.example.invalid
configs:
  params:
    server.insecure: false
    # Enable the ApplicationSet SCM/PR provider generators.
    # Required since ArgoCD 2.5 — disabled by default as a security gate.
    applicationsetcontroller.enable.scm.providers: "true"
    # Allowlist of SCM provider base URLs the ApplicationSet controller
    # may contact. Required since ArgoCD 2.9.
    applicationsetcontroller.allowed.scm.providers: "https://gitlab.com,https://github.com"
  cm:
    application.resourceTrackingMethod: annotation
controller:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
server:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
  ingress:
    enabled: false
repoServer:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
notifications:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
dex:
  enabled: false
redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 1000m
      memory: 512Mi
