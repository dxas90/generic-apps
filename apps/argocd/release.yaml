apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: argocd
spec:
  interval: 15m
  timeout: 10m
  releaseName: argocd
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: argocd-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: argo-cd
      version: 10.11.1
      sourceRef:
        kind: HelmRepository
        name: argocd
