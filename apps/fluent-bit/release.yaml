apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fluent-bit
  namespace: observability
spec:
  interval: 15m
  timeout: 10m
  releaseName: fluent-bit
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      retries: 3
  driftDetection:
    mode: enabled
  valuesFrom:
  - kind: ConfigMap
    name: fluent-bit-values
    valuesKey: values.yaml
  chart:
    spec:
      chart: fluent-bit
      version: 0.58.3
      sourceRef:
        kind: HelmRepository
        name: fluent-bit
