controller:
  replicaCount: 1
  ingressClassResource:
    name: nginx
    default: true
  config:
    enable-brotli: "true"
    enable-real-ip: "true"
    hsts-max-age: "31449600"
    use-forwarded-headers: "true"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 2000m
      memory: 1Gi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
