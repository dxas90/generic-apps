stages:
  - validate
  - publish

variables:
  HELM_VERSION: "4.3.1"
  KUSTOMIZE_VERSION: "5.8.3"
  KUBE_VERSION: "1.33.0"
  FLUX_VERSION: "2.4.0"

# ── kustomize build ────────────────────────────────────────────────────────────
validate:kustomize:
  stage: validate
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - curl -fsSL
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
        | tar -xz -C /usr/local/bin
    - kustomize version
  script:
    - |
      fail=0
      for a in apps/*/; do
        if kustomize build "$a" >/dev/null 2>&1; then
          echo "OK   ${a%/}"
        else
          echo "FAIL ${a%/}"
          kustomize build "$a" 2>&1 | tail -6
          fail=1
        fi
      done
      exit $fail

# ── helm template (offline render of every pinned chart + values) ──────────────
validate:helm:
  stage: validate
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: pip-pyyaml
    paths:
      - .pip-cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
        | tar -xz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - helm version
    - pip install --quiet pyyaml
  script:
    - python scripts/render-helm.py

# ── push OCI artifact → GitLab Container Registry ─────────────────────────────
publish:
  stage: publish
  image: alpine:3.24
  needs:
    - validate:kustomize
    - validate:helm
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  before_script:
    - apk add --no-cache curl
    - curl -fsSL
        "https://github.com/fluxcd/flux2/releases/download/v${FLUX_VERSION}/flux_${FLUX_VERSION}_linux_amd64.tar.gz"
        | tar -xz -C /usr/local/bin
    - flux version --client
  script:
    - |
      flux push artifact \
        oci://${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        --path=./apps \
        --source="${CI_PROJECT_URL}.git" \
        --revision="${CI_COMMIT_REF_NAME}@sha1:${CI_COMMIT_SHA}" \
        --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}"

      flux tag artifact \
        oci://${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        --tag latest \
        --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}"

      if [ -n "${CI_COMMIT_TAG}" ]; then
        flux tag artifact \
          oci://${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} \
          --tag "${CI_COMMIT_TAG}" \
          --creds="${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}"
      fi
