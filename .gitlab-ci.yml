stages:
  - validate

variables:
  HELM_VERSION: "4.3.1"
  KUSTOMIZE_VERSION: "5.8.3"
  KUBE_VERSION: "1.33.0"

# ── kustomize build ────────────────────────────────────────────────────────────
validate:kustomize:
  stage: validate
  image: python:3.12-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - curl -fsSL
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
        | tar -xz -C /usr/local/bin
    - kustomize version
  script:
    - |
      fail=0
      for a in apps/*/; do
        if kustomize build "$a" >/dev/null 2>&1; then
          echo "OK   ${a%/}"
        else
          echo "FAIL ${a%/}"
          kustomize build "$a" 2>&1 | tail -6
          fail=1
        fi
      done
      exit $fail

# ── helm template (offline render of every pinned chart + values) ──────────────
validate:helm:
  stage: validate
  image: python:3.12-slim
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.pip-cache"
  cache:
    key: pip-pyyaml
    paths:
      - .pip-cache/
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates
    - curl -fsSL "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
        | tar -xz -C /tmp
    - mv /tmp/linux-amd64/helm /usr/local/bin/helm
    - helm version
    - pip install --quiet pyyaml
  script:
    - python scripts/render-helm.py
